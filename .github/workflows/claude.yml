# Managed by maxpetretta/dotfiles (scripts/claude-review-setup, from github/claude.yml).
# Edit it there and rerun the script; a local edit is overwritten on the next run.
#
# The general Claude assistant, from claude-code-action's examples/claude.yml: a comment, review or
# issue from the owner or a collaborator that mentions @claude starts Claude Code on Max's Claude
# subscription (repository secret CLAUDE_CODE_OAUTH_TOKEN), and it answers or pushes commits.
# "@claude review" on a pull request belongs to claude-review.yml, so this workflow ignores it there.
# claude-code-action also refuses anyone without write access; checking the author association here
# keeps outsiders on public repositories from starting runners at all.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
       !(github.event.issue.pull_request && contains(github.event.comment.body, '@claude review')) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
       (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on pull requests
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # --permission-mode auto, as in claude-code-action's own claude.yml: a tool call the action's
          # allowed tools don't cover runs only if Claude Code's safety review passes it. The action sets
          # --permission-mode acceptEdits for @claude mentions, and this one, which comes after it, wins.
          claude_args: |
            --model claude-opus-5-5
            --effort high
            --permission-mode auto
